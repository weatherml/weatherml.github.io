name: Suggest a paper
description: Suggest a paper that is missing from the collection
title: "Suggest paper: "
body:
  - type: input
    id: arxiv
    attributes:
      label: arXiv URL or ID
      placeholder: "https://arxiv.org/abs/2604.09041"
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else? (optional)
      description: e.g. why it belongs here, or the category you'd put it in
