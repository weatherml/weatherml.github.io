site_name: weatherml
site_url: https://weatherml.github.io/
repo_url: https://github.com/weatherml/weatherml.github.io
repo_name: weatherml/weatherml.github.io
edit_uri: edit/main/docs/
copyright: >-
  <a href="https://github.com/weatherml/weatherml.github.io/issues/new?template=suggest-paper.yml">Suggest a paper</a>
  · <a href="/feed.xml">RSS feed</a>
  · <a href="/all_papers.bib" download>All papers as BibTeX</a>
theme:
  name: material
  custom_dir: overrides
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: blue
    accent: cyan
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: blue
    accent: cyan
    toggle:
      icon: material/brightness-4
      name: Switch to light mode
  icon:
    logo: material/weather-partly-cloudy
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  features:
  - content.code.copy
  - content.tabs.link
  - navigation.indexes
  - navigation.top
  - navigation.tabs
  - navigation.instant
  - navigation.instant.prefetch
  - navigation.instant.progress
  - search.highlight
  - search.share
  - search.suggest
  - toc.follow

plugins:
  - search
  - redirects:
      redirect_maps:
        # /papers/ used to be a single page of every paper
        papers/index.md: papers/global-models/index.md
        # Former topics, now the "Uncertainty & ensembles" and "Extremes" tags
        papers/ensembles/index.md: explore/index.md
        papers/extreme-weather/index.md: explore/index.md

extra_css:
  - stylesheets/extra.css
  - https://cdn.jsdelivr.net/npm/katex@0.18.9/dist/katex.min.css
extra_javascript:
  - javascripts/bibtex.js
  - javascripts/home-link.js
  - javascripts/tag-filter.js
  - https://cdn.jsdelivr.net/npm/katex@0.18.9/dist/katex.min.js
  - javascripts/katex.js

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 2
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

